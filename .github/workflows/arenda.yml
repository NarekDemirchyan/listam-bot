name: arenda

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arenda
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install requests markdownify playwright
          python -m playwright install --with-deps chromium

      - name: Fix code
        run: |
          for f in is_empty card_block make_caption button_message send load save next_candidate publish main; do
            sed -i "s/^[[:space:]]\+def $f(/def $f(/" arenda.py
          done
          sed -i -E 's|^[[:space:]]*ESTATE_LIST[[:space:]]*=.*|ESTATE_LIST = []|' arenda.py
          sed -i -E 's|^[[:space:]]*MY_LIST[[:space:]]*=.*|MY_LIST = []|' arenda.py
          sed -i -E 's|^[[:space:]]*ORDER[[:space:]]*=.*|ORDER = ["list"]|' arenda.py
          sed -i -E 's|^[[:space:]]*INTERVAL[[:space:]]*=.*|INTERVAL = 7 * 60|' arenda.py
          sed -i -E 's#^[[:space:]]*(QUEUE_MAX|MAX_QUEUE|QUEUE_LIMIT)[[:space:]]*=.*#\1 = 500#' arenda.py
          grep -n -E '^[[:space:]]*(LIST_CATS|ESTATE_LIST|MY_LIST|ORDER|INTERVAL)' arenda.py
          grep -n -E '^[[:space:]]*(QUEUE_MAX|MAX_QUEUE|QUEUE_LIMIT)' arenda.py || echo "ԶԳՈՒՇԱՑՈՒՄ. առաստաղի տողը չգտնվեց"
          python -c "import ast;ast.parse(open('arenda.py',encoding='utf-8').read());print('syntax ok')"

      - name: Clean queue
        run: |
          python - <<'PY'
          import json, os
          p = "state-arenda.json"
          if os.path.exists(p):
              st = json.load(open(p, encoding="utf-8"))
              q = st.get("queue", [])
              keep = [it for it in q if it.get("src") == "list"]
              if len(keep) != len(q):
                  st["queue"] = keep
                  json.dump(st, open(p, "w", encoding="utf-8"), ensure_ascii=False)
                  print("հերթից հանվեց", len(q) - len(keep), "ոչ-list հայտարարություն")
              else:
                  print("հերթը մաքուր է")
          PY

      - name: Run arenda
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID_ARENDA: ${{ secrets.TELEGRAM_CHAT_ID_ARENDA }}
          JINA_KEY: ${{ secrets.JINA_KEY }}
        run: python arenda.py

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A || true
          git commit -m "state-arenda" || echo "no changes"
          git pull --rebase --autostash || true
          git push || true
