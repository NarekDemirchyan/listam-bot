name: arenda

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arenda
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install requests markdownify playwright
          python -m playwright install --with-deps chromium

      - name: Run arenda
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID_ARENDA: ${{ secrets.TELEGRAM_CHAT_ID_ARENDA }}
        run: python arenda.py

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state-arenda.json || true
          git commit -m "state-arenda" || echo "no changes"
          git pull --rebase --autostash || true
          git push || true
