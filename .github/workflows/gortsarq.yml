name: gortsarq

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: gortsarq
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fix code
        run: |
          perl -0777 -i -pe 's/^(CHAT_ID = os\.environ\.get\("TELEGRAM_CHAT_ID", ""\))$/$1\nJINA_KEY = os.environ.get("JINA_KEY", "")/m unless /^JINA_KEY = /m; s/^(    h = dict\(HDRS\))$/$1\n    if JINA_KEY:\n        h["Authorization"] = "Bearer " + JINA_KEY/m unless /^        h\["Authorization"\]/m; s/ok = bool\(cap\) and send\(sess, d, cap\)/ok = bool(cap) and bool(d["photos"]) and send(sess, d, cap)/ unless /bool\(d\["photos"\]\)/; s/if has_cyr\(alt\):/if has_cyr(alt) and not alt.rstrip().endswith(".") and len(alt.split()) >= 3:/ unless /endswith\("\."\)/' gortsarq.py
          python -m py_compile gortsarq.py
          grep -n "JINA_KEY" gortsarq.py

      - name: run
        run: |
          pip install requests
          python gortsarq.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JINA_KEY: ${{ secrets.JINA_KEY }}

      - name: save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state-gortsarq.json gortsarq.py
          git diff --cached --quiet || git commit -m "state-gortsarq + fix"
          git pull --rebase --autostash || true
          git push || true
