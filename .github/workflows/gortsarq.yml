name: gortsarq

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: gortsarq
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fix code
        run: |
          perl -0777 -i -pe '
          s#^(CHAT_ID = os\.environ\.get\("TELEGRAM_CHAT_ID", ""\))$#$1\nJINA_KEY = os.environ.get("JINA_KEY", "")#m unless /^JINA_KEY = /m;
          s#^(    h = dict\(HDRS\))$#$1\n    if JINA_KEY:\n        h["Authorization"] = "Bearer " + JINA_KEY#m unless /^        h\["Authorization"\]/m;
          s#ok = bool\(cap\) and send\(sess, d, cap\)#ok = bool(cap) and bool(d["photos"]) and send(sess, d, cap)# unless /bool\(d\["photos"\]\)/;
          s#if has_cyr\(alt\):#if has_cyr(alt) and not alt.rstrip().endswith(".") and len(alt.split()) >= 3:# unless /endswith\("\."\)/;
          s#for attempt in range\(4\):#for attempt in range(2):# unless /for attempt in range\(2\):/;
          s#time.sleep\(8 \* \(attempt \+ 1\)\)#time.sleep(3 * (attempt + 1))# unless /time.sleep\(3 \* /;
          ' gortsarq.py
          if python -m py_compile gortsarq.py; then echo "patch ok"; else echo "patch FAILED"; git checkout -- gortsarq.py; fi

      - name: Test
        env:
          JINA_KEY: ${{ secrets.JINA_KEY }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          echo "== jina =="
          curl -s -o /tmp/j.txt -w "jina http %{http_code}\n" -H "Authorization: Bearer $JINA_KEY" "https://r.jina.ai/https://example.com"
          head -c 150 /tmp/j.txt || true
          echo "== list.am direct =="
          curl -s -o /tmp/l.txt -w "list.am http %{http_code}\n" -A "$UA" "https://www.list.am/ru/category/4"
          wc -c < /tmp/l.txt
          grep -c "Just a moment" /tmp/l.txt || true
          echo "== gortsarq direct =="
          curl -s -o /tmp/g.txt -w "gortsarq http %{http_code}\n" -A "$UA" "https://gortsarq.am/ru/265c-2-ansharj-guyq/"
          wc -c < /tmp/g.txt
          grep -c "Just a moment" /tmp/g.txt || true
          echo "== translate direct =="
          curl -s -o /tmp/t.txt -w "google http %{http_code}\n" -A "$UA" "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ru&dt=t&q=hello"
          head -c 120 /tmp/t.txt || true
          curl -s -o /tmp/t2.txt -w "clients5 http %{http_code}\n" -A "$UA" "https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=auto&tl=ru&q=hello"
          head -c 120 /tmp/t2.txt || true

      - name: run
        run: |
          pip install requests
          python gortsarq.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JINA_KEY: ${{ secrets.JINA_KEY }}

      - name: save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state-gortsarq.json gortsarq.py
          git diff --cached --quiet || git commit -m "state-gortsarq + fix"
          git pull --rebase --autostash || true
          git push || true
