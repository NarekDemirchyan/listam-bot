name: gortsarq

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gortsarq
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install requests markdownify playwright
          python -m playwright install --with-deps chromium

      - name: Fix code
        run: |
          perl -0777 -i -pe '
          s/\n(main\(\)\s*)$/\nfrom fetcher import jina\n\n$1/m unless /from fetcher import jina/;
          s#for attempt in range\(4\):#for attempt in range(2):# unless /for attempt in range\(2\):/;
          s#time\.sleep\(8 \* \(attempt \+ 1\)\)#time.sleep(3 * (attempt + 1))# unless /time\.sleep\(3 \* /;
          s#if has_cyr\(alt\):#if has_cyr(alt) and len(alt.split()) >= 3:# unless /len\(alt\.split\(\)\) >= 3/;
          s#ok = bool\(cap\) and send\(sess, d, cap\)#ok = bool(cap) and bool(d["photos"]) and send(sess, d, cap)# unless /bool\(d\["photos"\]\)/;
          ' gortsarq.py
          grep -n "from fetcher" gortsarq.py || true
          if python -m py_compile gortsarq.py; then echo "patch ok"; else echo "patch FAILED"; git checkout -- gortsarq.py; fi

      - name: run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gortsarq.py

      - name: save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state-gortsarq.json gortsarq.py
          git diff --cached --quiet || git commit -m "state-gortsarq + fix"
          git pull --rebase --autostash || true
          git push || true
